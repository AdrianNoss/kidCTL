# Projektseite (website/, Hugo) bauen und auf GitHub Pages veröffentlichen.
# Auslöser: Push auf main mit Änderungen an der Seite oder den Anleitungen (docs/, SECURITY*.md), veröffentlichtes
# Release (Release-Liste), von Hand.
# Einmalig in den Repo-Einstellungen: Settings → Pages → Source „GitHub Actions“.
# Schritte: Releases holen → Prüfergebnisse (Scorecard, Observatory) → Platzhalter-Check (Impressum) → Doku-Parität DE/EN → hugo --minify → Suchindex
# (Pagefind, pip, gepinnt) → Deploy.
# Release-Ereignis: nicht selbst bauen, sondern sich per workflow_dispatch neu starten. Pages verwirft sonst still die
# Bereitstellung, weil der Release-Commit schon per Push deployt wurde (gleiche pages_build_version = Commit-SHA;
# actions/deploy-pages#383) – die Seite bliebe auf der alten Release-Liste stehen.

name: Projektseite

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "SECURITY.md", "SECURITY.de.md", "dev/check_docs_parity.py",
            ".github/workflows/pages.yml"]
  release:
    types: [published]
  schedule:
    - cron: "11 6 * * 1"   # wöchentlich: Prüfergebnisse auffrischen
  workflow_dispatch:
    inputs:
      tag:
        description: "Neuer Release-Tag, auf den beim Holen der Release-Liste gewartet wird (optional)"
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.170.0"
  PAGEFIND_VERSION: "1.6.0"

jobs:
  redispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Workflow neu anstoßen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Hugo installieren
        run: |
          deb="hugo_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${deb}"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt" \
            | grep " ${deb}\$" | sha256sum -c -
          sudo dpkg -i "$deb"
          hugo version

      - name: Releases holen
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ inputs.tag }}
        run: |
          # Nach einem Release kennt die Liste den neuen Release oft erst einige Sekunden später: bis zu 2 min warten.
          for i in $(seq 1 12); do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '[.[] | {tag_name, name, draft, prerelease, published_at, html_url, body,
                     assets: [.assets[] | {name, size, browser_download_url}]}]' \
              | jq -s 'add // []' > website/data/releases.json
            if [ -z "$NEW_TAG" ] || jq -e --arg t "$NEW_TAG" 'any(.[]; .tag_name == $t)' website/data/releases.json >/dev/null; then
              break
            fi
            echo "Release $NEW_TAG noch nicht in der Liste – warte ($i/12)"; sleep 10
          done
          jq length website/data/releases.json

      - name: Prüfergebnisse holen (Scorecard, Observatory)
        # Für die Box „Automatisch geprüft“ auf der Startseite – als Text, keine externen Bilder. Fehler: Box ohne Wert.
        run: |
          sc=$(curl -fsS "https://api.securityscorecards.dev/projects/github.com/${GITHUB_REPOSITORY}" || echo '{}')
          ob=$(curl -fsS -X POST "https://observatory-api.mdn.mozilla.net/api/v2/scan?host=app.kidctl.de" || echo '{}')
          jq -n --argjson sc "$sc" --argjson ob "$ob" '{
            scorecard: {score: ($sc.score // null), date: ($sc.date // null)},
            observatory: {grade: ($ob.grade // null), date: ($ob.scanned_at // null), url: ($ob.details_url // null)}
          }' > website/data/checks.json
          cat website/data/checks.json

      - name: Platzhalter-Check (Impressum)
        run: |
          if grep -rn "TODO-IMPRESSUM" website/content website/data website/i18n website/themes; then
            echo "::error::Platzhalter TODO-IMPRESSUM noch enthalten – Impressum ausfüllen, dann erneut veröffentlichen."
            exit 1
          fi

      - name: Doku-Parität (Deutsch/Englisch)
        run: python3 dev/check_docs_parity.py

      - name: Bauen
        working-directory: website
        run: hugo --minify --gc --panicOnWarning

      - name: security.txt – Expires auf heute + 1 Jahr
        run: |
          sed -i "s/^Expires: .*/Expires: $(date -u -d '+1 year' +%Y-%m-%dT%H:%M:%SZ)/" website/public/.well-known/security.txt
          cat website/public/.well-known/security.txt

      - name: Suchindex (Pagefind)
        run: |
          python3 -m venv "$RUNNER_TEMP/pagefind"   # Ubuntu-Python ist „externally managed“ (PEP 668)
          "$RUNNER_TEMP/pagefind/bin/pip" install -q "pagefind[bin]==${PAGEFIND_VERSION}"
          "$RUNNER_TEMP/pagefind/bin/python" -m pagefind --site website/public

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: website/public
          include-hidden-files: true   # .well-known/security.txt

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
