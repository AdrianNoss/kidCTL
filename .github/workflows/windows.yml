# Windows-Installer in GitHub Actions bauen und über SignPath signieren lassen.
#
# Auslöser: Tag „v<Version>“ (muss zu agent/kidctl_agent/__init__.py passen) oder manuell.
# Signatur nur, wenn die Repository-Variablen SIGNPATH_* und das Secret SIGNPATH_API_TOKEN gesetzt sind;
# sonst endet der Lauf mit dem unsignierten Installer als Artefakt.
# Danach lokal: packaging/windows/build.py fetch --apply && packaging/windows/build.py sign --apply
# (latest.json wird mit dem Update-Schlüssel signiert, der nie in GitHub liegt).

name: Windows-Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # SignPath liest Job-Details und lädt das Artefakt

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Version prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ver=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('agent/kidctl_agent/__init__.py').read()).group(1))")
          test "v$ver" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME passt nicht zur Version $ver"; exit 1; }

      - name: Installer bauen
        run: python packaging/windows/build.py ci --apply --out dist

      - name: Unsignierten Installer hochladen
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: KidCTL-Setup-unsigned
          path: dist/KidCTL-Setup-*.exe
          if-no-files-found: error

      - name: Über SignPath signieren
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000   # Freigabe in SignPath erfolgt von Hand (max. 5 h)
          output-artifact-directory: signed

      - name: Signierten Installer hochladen
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: KidCTL-Setup-signed
          path: signed/KidCTL-Setup-*.exe
          if-no-files-found: error
