# Dependabot: wöchentliche Update-PRs, je Ökosystem ein gruppierter PR.
# Die Windows-Laufzeit (packaging/windows/vendor.lock) kennt Dependabot nicht – dafür prüft workflows/audit.yml.
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      server-pip:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
