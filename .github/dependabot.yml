# Dependabot: wöchentliche Update-PRs, je Ökosystem ein gruppierter PR.
# Die Windows-Laufzeit (packaging/windows/vendor.lock) kennt Dependabot nicht – dafür prüft workflows/audit.yml.
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      server-pip:
        patterns: ["*"]
    ignore:
      # passlib 1.7.4 ist mit bcrypt 5.x inkompatibel ("password cannot be longer than 72 bytes") – bleibt auf 4.0.1
      - dependency-name: bcrypt
        versions: [">=4.1"]
  - package-ecosystem: pip   # CI-Abhängigkeiten (pip-compile mit Hashes, Dependabot erzeugt die .txt neu)
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ci-pip:
        patterns: ["*"]
    ignore:
      - dependency-name: bcrypt
        versions: [">=4.1"]
  - package-ecosystem: docker   # Basis-Image des Servers (Digest)
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: python   # nur neue Digests derselben Version, keinen Sprung auf 3.13+
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: pip   # Feature-Inbox (tools/feature-inbox/requirements.txt, mit Hashes)
    directory: /tools/feature-inbox
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
  - package-ecosystem: docker   # Basis-Image der Feature-Inbox (Digest, wie der Server)
    directory: /tools/feature-inbox
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
