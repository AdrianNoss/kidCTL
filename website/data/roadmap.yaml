# Roadmap der Projektseite. Pflege: Claude Code, sobald in spec.md ein Feature entschieden (planned), begonnen
# (in_progress) oder abgeschlossen (done) wird. Keine Termine, keine Abrechnungs-, Missbrauchs- oder Rechtsdetails.
# Felder: id, status (planned | in_progress | done), optional version, title/text je Sprache (de/en).
# Reihenfolge: älteste zuerst; die Startseite zeigt von „done“ die letzten vier.

