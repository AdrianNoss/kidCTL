# Funktionen auf der Startseite. Große Einträge mit Screenshot (shot = Name in dev/screenshots.py,
# variant desktop|mobile|pair; client = Client-Screenshot aus static/img/client/), small: true = Karte ohne Bild.
- id: screentime
  icon: timer
  shot: child-times
  variant: pair
  title: { de: "Bildschirmzeit", en: "Screen time" }
  text:
    de: "Tageskontingent und erlaubte Zeitfenster je Wochentag, gezählt über alle Rechner eines Kindes."
    en: "Daily allowance and allowed hours per weekday, counted across all of a child's computers."
  points:
    de:
      - "Vorwarnungen vor Ablauf, danach Abmeldung und Login-Sperre"
      - "Ausnahmen für einzelne Tage, „Jetzt sperren“ mit einem Tipp"
      - "Funktioniert offline mit der zuletzt bekannten Regel"
    en:
      - "Warnings before time runs out, then sign-out and sign-in lock"
      - "Exceptions for single days, “lock now” with one tap"
      - "Works offline with the last known rules"
  shot_alt: { de: "Zeiten eines Kindes: Wochenvorlage mit Kontingent und Zeitfenstern", en: "A child's times: weekly schedule with allowance and allowed hours" }
- id: requests
  icon: chat
  shot: chat
  variant: pair
  title: { de: "Anfragen und Chat", en: "Requests and chat" }
  text:
    de: "Das Kind bittet in der Tray-App um mehr Zeit, mehr Spielzeit oder eine gesperrte App oder Website. Du antwortest per Push auf dem Handy."
    en: "The child asks for more time, more game time or a blocked app or website from the tray app. You answer from your phone via push notification."
  points:
    de:
      - "„Immer erlauben“, „nur heute“ oder „ablehnen“"
      - "Kurze Nachrichten in beide Richtungen"
    en:
      - "“Always allow”, “today only” or “decline”"
      - "Short messages in both directions"
  shot_alt: { de: "Chat mit einer Anfrage nach mehr Zeit", en: "Chat with a request for more time" }
- id: apps
  icon: apps
  shot: child-programs
  title: { de: "Programmkontrolle", en: "App control" }
  text:
    de: "Nur freigegebene Programme starten – oder erst einmal nur protokollieren, was genutzt wird."
    en: "Only allowed apps start – or just log what is being used to begin with."
  points:
    de:
      - "Katalog der installierten Apps, Flatpak, Steam und Heroic; unter Windows Startmenü und Store-Apps"
      - "Selbst heruntergeladene Programme laufen nicht (noexec bzw. Ausführverbot im Profil)"
    en:
      - "Catalogue of installed apps, Flatpak, Steam and Heroic; on Windows Start menu and Store apps"
      - "Self-downloaded programs don't run (noexec or execution ban on the user profile)"
  shot_alt: { de: "Programme eines Kindes mit Freigaben", en: "A child's apps with allowed entries" }
- id: web
  icon: globe
  shot: child-internet
  title: { de: "Website-Filter", en: "Web filter" }
  text:
    de: "DNS-Filter je Kind: nur erlaubte Seiten (Whitelist) oder alles außer Sperrlisten (Blacklist)."
    en: "DNS filter per child: only allowed sites (allow list) or everything except block lists."
  points:
    de:
      - "Dienst-Bundles wie YouTube, Wikipedia, Lern-Apps, Microsoft 365"
      - "Sperrlisten HaGeZi, OISD, StevenBlack; SafeSearch je Kind"
      - "DNS-over-HTTPS der Browser wird unterbunden"
    en:
      - "Service bundles like YouTube, Wikipedia, learning apps, Microsoft 365"
      - "Block lists HaGeZi, OISD, StevenBlack; SafeSearch per child"
      - "Browsers' DNS-over-HTTPS is blocked"
  shot_alt: { de: "Website-Filter mit Bundles und Ausnahmen", en: "Web filter with bundles and exceptions" }
- id: stats
  icon: chart
  shot: stats
  title: { de: "Statistik und Protokoll", en: "Statistics and log" }
  text:
    de: "Nutzung pro Tag, Programm und Spiel sowie ein Protokoll gesperrter Aktionen – ohne Verlauf erlaubter Websites."
    en: "Usage per day, app and game plus a log of blocked actions – without a history of allowed websites."
  points:
    de:
      - "Spiele-Limit: eigenes Kontingent für Spiele, der Rest des Rechners bleibt nutzbar"
      - "Optional wöchentlicher oder monatlicher Bericht per Mail"
    en:
      - "Game limit: a separate allowance for games, the rest of the computer stays usable"
      - "Optional weekly or monthly report by email"
  shot_alt: { de: "Statistik über 14 Tage", en: "Statistics over 14 days" }
- id: child-view
  icon: child
  client: tray
  title: { de: "Was das Kind sieht", en: "What the child sees" }
  text:
    de: "Die Tray-App zeigt Restzeit und Chat, Vorwarnungen kommen als Benachrichtigung. Beenden kann das Kind sie, an den Regeln ändert das nichts."
    en: "The tray app shows remaining time and chat, warnings arrive as notifications. The child can close it – the rules stay in force."
  shot_alt: { de: "Tray-App mit Restzeit (Platzhalter, folgt)", en: "Tray app with remaining time (placeholder, coming soon)" }
- id: devices
  icon: laptop
  small: true
  title: { de: "Mehrere Rechner", en: "Several computers" }
  text:
    de: "Ein Kind, mehrere Rechner – Linux und Windows gemischt. Die Zeit zählt gemeinsam."
    en: "One child, several computers – Linux and Windows mixed. Time is counted together."
- id: alerts
  icon: bell
  small: true
  title: { de: "Alarme", en: "Alerts" }
  text:
    de: "Push, wenn ein Rechner zu lange offline ist oder eine Schutzmaßnahme manipuliert wurde."
    en: "Push when a computer is offline for too long or a protection was tampered with."
- id: parents
  icon: users
  small: true
  title: { de: "Mehrere Eltern", en: "Several parents" }
  text:
    de: "Jedes Elternteil mit eigenem Login, eigener Sprache und eigenen Benachrichtigungen."
    en: "Each parent with their own sign-in, language and notifications."
- id: app
  icon: phone
  small: true
  title: { de: "Als App aufs Handy", en: "As an app on your phone" }
  text:
    de: "Die WebUI lässt sich als App installieren (PWA), hell und dunkel."
    en: "The web interface can be installed as an app (PWA), light and dark."
- id: lang
  icon: language
  small: true
  title: { de: "Deutsch und Englisch", en: "English and German" }
  text:
    de: "WebUI, Mails und alles auf dem Kinderrechner in beiden Sprachen."
    en: "Web interface, emails and everything on the child's computer in both languages."
- id: updates
  icon: update
  small: true
  title: { de: "Updates", en: "Updates" }
  text:
    de: "Linux über Pacman bzw. APT aus deinem Repository, Windows aktualisiert sich selbst."
    en: "Linux via pacman or APT from your repository, Windows updates itself."
- id: export
  icon: download
  small: true
  title: { de: "Eure Daten mitnehmen", en: "Take your data with you" }
  text:
    de: "Export aller Daten der Familie als ZIP, Import auf einem anderen KidCTL-Server – auch zwischen Self-Hosting und gehostet."
    en: "Export all of your family's data as a ZIP and import it on another KidCTL server – also between self-hosting and hosted."
- id: whitelabel
  icon: edit
  small: true
  title: { de: "Eigenes Erscheinungsbild", en: "Your own branding" }
  text:
    de: "Eigener Name, Logo und App-Icon für Weboberfläche, App und Mails – mit dem Hinweis „powered by KidCTL“."
    en: "Your own name, logo and app icon for the web interface, app and emails – with a \"powered by KidCTL\" note."
- id: newsletter
  icon: mail
  small: true
  title: { de: "Neuigkeiten per Mail", en: "News by email" }
  text:
    de: "Der Betreiber informiert über neue Versionen und Funktionen – nur wenn eure Familie zustimmt, jederzeit abbestellbar."
    en: "The operator tells you about new versions and features – only if your family opts in, unsubscribe at any time."
