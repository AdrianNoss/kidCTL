# Punkte „Datenschutz & Sicherheit“ auf der Startseite.
- de: "**Selbst gehostet:** Regeln, Statistik und Chat liegen auf deinem Server. Keine Cloud, kein Konto bei Dritten."
  en: "**Self-hosted:** rules, statistics and chat live on your server. No cloud, no account with third parties."
- de: "**Keine Telemetrie:** Weder Server noch Kinderrechner melden etwas an die Entwickler."
  en: "**No telemetry:** neither the server nor the child's computer reports anything to the developers."
- de: "**Kein Browserverlauf:** Gespeichert werden nur gesperrte Aufrufe, nicht welche erlaubten Seiten besucht wurden."
  en: "**No browsing history:** only blocked requests are stored, not which allowed sites were visited."
- de: "**Eltern-Login nur mit zweitem Faktor (TOTP),** Rate-Limiting und CSRF-Schutz."
  en: "**Parent sign-in only with a second factor (TOTP),** rate limiting and CSRF protection."
- de: "**Signierte Updates:** Pacman- und APT-Repository mit GPG, Windows-Updates mit Ed25519-Signatur."
  en: "**Signed updates:** pacman and APT repository with GPG, Windows updates with an Ed25519 signature."
- de: "**Admins bleiben frei:** root, `sudo`/`wheel` und Windows-Administratoren werden nie eingeschränkt."
  en: "**Admins stay free:** root, `sudo`/`wheel` and Windows administrators are never restricted."
- de: "**Offener Quelltext** unter der AGPL-3.0 – prüfbar, veränderbar, kostenlos."
  en: "**Open source** under the AGPL-3.0 – auditable, modifiable, free of charge."
