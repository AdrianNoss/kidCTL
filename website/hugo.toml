# kidCTL-Projektseite (Hugo, eigenes Theme, kein Node). Domain: kidctl.de (Repo-Einstellung Pages → Custom domain).
baseURL = "https://kidctl.de/"
title = "KidCTL"
theme = "kidctl"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  github = "https://github.com/AdrianNoss/kidCTL"
  # Wiki (Anleitungen aus ../docs, eingebunden per Mount unten); Pfad relativ zur Sprachstartseite
  docs = "docs/"
  license = "AGPL-3.0-or-later"
  # OpenSSF-Best-Practices-Projekt (Link in der Box „Automatisch geprüft“)
  bestpractices_id = 16981

[languages]
  [languages.en]
    label = "English"
    locale = "en"
    weight = 1
  [languages.de]
    label = "Deutsch"
    locale = "de"
    weight = 2

[outputs]
  home = ["html"]
  section = ["html", "rss"]

[markup.goldmark.renderer]
  unsafe = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

# Wiki: docs/<name>.md (Englisch) und docs/<name>.de.md (Deutsch) aus dem Repo als Abschnitt /docs/ bzw. /de/docs/,
# Bilder aus docs/img/ unter /docs/img/. Mit eigenen Mounts müssen die Standard-Mounts mit aufgeführt werden.
[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "../docs"
  target = "content/docs"
  files = ["! img/**"]
# Sicherheitsrichtlinie aus dem Repo-Root als Wiki-Seite „security“
[[module.mounts]]
  source = "../SECURITY.md"
  target = "content/docs/security.md"
[[module.mounts]]
  source = "../SECURITY.de.md"
  target = "content/docs/security.de.md"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "../docs/img"
  target = "static/docs/img"

[markup.highlight]
  noClasses = false
  codeFences = false

[privacy]
  [privacy.youTube]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.x]
    disable = true

[services.rss]
  limit = 20
