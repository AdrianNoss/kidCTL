shot_dashboard: "Parents' web interface: overview of all children"
platforms_eyebrow: "Platforms"
platforms_title: "Runs where your children are"
platforms_lead: "One server for the whole family; an agent on each child's computer enforces the rules – also offline."
features_eyebrow: "Features"
features_title: "Everything in one place"
features_lead: "Clear rules instead of surveillance: KidCTL counts time and blocks what isn't allowed, but stores no browsing history."
how_eyebrow: "How it works"
how_title: "Server, agent, tray app"
how_lead: "You run the server; the child's computer only connects to it. Nothing goes through the developers."
how_parents: "Parents"
how_parents_text: "Web interface in the browser or installed as an app on the phone, with push notifications for requests and alerts."
how_server: "Your server"
how_server_text: "Docker container behind your reverse proxy. Stores rules and statistics, serves the signed package repository."
how_ws: "WebSocket, outgoing"
how_client: "Child's computer"
how_client_text: "Agent as a system service enforces time, apps and web filter. The tray app shows remaining time and chat – closing it changes nothing."
trust_eyebrow: "Privacy & security"
trust_title: "Built for families, not for data collection"
trust_lead: "KidCTL only talks to the server you run yourself."
install_eyebrow: "Quick start"
install_title: "Install"
install_lead: "The short version for people who run their own server. You need Docker with a reverse proxy (e.g. Traefik) and a domain with HTTPS."
