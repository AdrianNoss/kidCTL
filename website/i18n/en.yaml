hero_eyebrow: "Self-hosted parental control for Windows and Linux"
hero_lead: "Screen time, game time, apps and websites for your children's computers – managed from your phone. Your data stays on your own server: no cloud, no account with third parties."
badge_selfhosted: "Your data on your server"
badge_notelemetry: "No telemetry"
