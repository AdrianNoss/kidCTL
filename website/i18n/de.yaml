shot_dashboard: "Eltern-WebUI: Übersicht aller Kinder"
platforms_eyebrow: "Plattformen"
platforms_title: "Läuft da, wo deine Kinder sind"
platforms_lead: "Ein Server für die ganze Familie; ein Agent auf jedem Kinderrechner setzt die Regeln durch – auch offline."
features_eyebrow: "Funktionen"
features_title: "Alles an einem Ort"
features_lead: "Klare Regeln statt Überwachung: KidCTL zählt Zeit und sperrt, was nicht erlaubt ist, speichert aber keinen Browserverlauf."
how_eyebrow: "So funktioniert's"
how_title: "Server, Agent, Tray-App"
how_lead: "Du betreibst den Server, der Kinderrechner verbindet sich nur mit ihm. Nichts läuft über die Entwickler."
how_parents: "Eltern"
how_parents_text: "WebUI im Browser oder als App aufs Handy installiert, mit Push-Benachrichtigung bei Anfragen und Alarmen."
how_server: "Dein Server"
how_server_text: "Docker-Container hinter deinem Reverse-Proxy. Speichert Regeln und Statistik und liefert das signierte Paket-Repository aus."
how_ws: "WebSocket, ausgehend"
how_client: "Kinderrechner"
how_client_text: "Der Agent setzt als Systemdienst Zeit, Programme und Website-Filter durch. Die Tray-App zeigt Restzeit und Chat – sie zu beenden ändert nichts."
trust_eyebrow: "Datenschutz & Sicherheit"
trust_title: "Für Familien gebaut, nicht zum Datensammeln"
trust_lead: "KidCTL spricht nur mit dem Server, den du selbst betreibst."
install_eyebrow: "Schnellstart"
install_title: "Installieren"
install_lead: "Die Kurzfassung für alle, die einen eigenen Server betreiben. Du brauchst Docker mit Reverse-Proxy (z. B. Traefik) und eine Domain mit HTTPS."
