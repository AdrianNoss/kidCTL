hero_eyebrow: "Selbst gehostete Kindersicherung für Windows und Linux"
hero_lead: "Bildschirmzeit, Spielzeit, Programme und Websites für die Rechner deiner Kinder – gesteuert vom Handy. Die Daten bleiben auf deinem eigenen Server: keine Cloud, kein Konto bei Dritten."
badge_selfhosted: "Deine Daten auf deinem Server"
badge_notelemetry: "Keine Telemetrie"
badge_opensource: "Open Source (AGPL-3.0)"
