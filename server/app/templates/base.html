<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KidCTL{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="/static/app.js" defer></script>
</head>
<body>
{% if current_parent %}
<header>
  <nav>
    <a href="/" class="brand">KidCTL</a>
    <a href="/children">Kinder</a>
    <a href="/devices">Geräte</a>
    <a href="/parents">Eltern</a>
    <a href="/settings">Benachrichtigungen</a>
  </nav>
  <form method="post" action="/logout" class="inline">
    <input type="hidden" name="{{ CSRF_FIELD }}" value="{{ csrf_token }}">
    <span class="muted">{{ current_parent.display_name or current_parent.username }}</span>
    <button type="submit" class="link">Abmelden</button>
  </form>
</header>
{% endif %}
<main>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
