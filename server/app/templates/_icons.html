{# Symbole (24 px, Linien), eigene Zeichnung im Stil von Material Symbols Outlined. Farbe über currentColor. #}
{% macro icon(name, cls="") -%}
<svg class="icon {{ cls }}" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"
     fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "home" %}<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>
{%- elif name == "child" %}<circle cx="12" cy="12" r="8.5"/><path d="M8.8 14.2a4 4 0 0 0 6.4 0"/><path d="M9.3 10h.01M14.7 10h.01" stroke-width="2.6"/>
{%- elif name == "devices" %}<rect x="4" y="5" width="16" height="11" rx="1.6"/><path d="M2.5 19.5h19"/>
{%- elif name == "parents" %}<circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c0-3.2 2.5-5.5 5.5-5.5s5.5 2.3 5.5 5.5"/><circle cx="16.8" cy="9.6" r="2.4"/><path d="M16.3 14.1c2.6.2 4.4 2.3 4.4 5.4"/>
{%- elif name == "settings" %}<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>
{%- elif name == "account" %}<circle cx="12" cy="8.5" r="3.7"/><path d="M4.5 20c.6-3.7 3.7-6 7.5-6s6.9 2.3 7.5 6"/>
{%- elif name == "logout" %}<path d="M14 4.5h3.5a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H14"/><path d="M9.5 8 5.5 12l4 4M5.5 12H15"/>
{%- elif name == "theme-auto" %}<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/>
{%- elif name == "theme-light" %}<circle cx="12" cy="12" r="3.8"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5 7 7M17 17l1.5 1.5M5.5 18.5 7 17M17 7l1.5-1.5"/>
{%- elif name == "theme-dark" %}<path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/>
{%- endif %}
</svg>
{%- endmacro %}
