{% extends "base.html" %}
{% block title %}Neues Passwort – KidCTL{% endblock %}
{% block content %}
<div class="card narrow">
  <div class="login-brand"><span class="mark" aria-hidden="true"></span>KidCTL</div>
  <h2>Neues Passwort</h2>
  {% if invalid %}
  <p class="error">Dieser Link ist ungültig oder abgelaufen.</p>
  <a href="/reset" class="btn secondary">Neuen Link anfordern</a>
  {% else %}
  <form method="post" action="/reset/{{ token }}">
    <input type="hidden" name="{{ CSRF_FIELD }}" value="{{ csrf_token }}">
    <label>Neues Passwort (min. 12 Zeichen) <input type="password" name="password" minlength="12" required autocomplete="new-password" autofocus></label>
    <label>Wiederholen <input type="password" name="repeat" minlength="12" required autocomplete="new-password"></label>
    <button type="submit" style="width:100%">Passwort speichern</button>
  </form>
  {% endif %}
</div>
{% endblock %}
