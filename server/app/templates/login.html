{% extends "base.html" %}
{% block title %}Anmelden – KidCTL{% endblock %}
{% block content %}
<form method="post" action="/login" class="card narrow">
  <h1>KidCTL</h1>
  <input type="hidden" name="{{ CSRF_FIELD }}" value="{{ csrf_token }}">
  <label>Benutzername <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
  <label>Passwort <input type="password" name="password" autocomplete="current-password" required></label>
  <label>Authenticator-Code <input name="totp" inputmode="numeric" pattern="[0-9 ]{6,7}" autocomplete="one-time-code" required></label>
  <button type="submit">Anmelden</button>
</form>
{% endblock %}
