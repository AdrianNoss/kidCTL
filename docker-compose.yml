# Zweite Instanz (z. B. dev.kidctl.de) in eigenem Ordner: KIDCTL_NAME und KIDCTL_HOST in dessen .env setzen
# (Container-, Router- und Middleware-Namen sowie Hostname); ohne Angabe gelten die Werte von app.kidctl.de.
services:
  db:
    image: postgres:17
    container_name: ${KIDCTL_NAME:-kidctl}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kidctl
      POSTGRES_DB: kidctl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      # Datenbankdateien; gesichert wird über die täglichen Dumps in ./data/backups (nicht dieses Verzeichnis)
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kidctl", "-d", "kidctl"]
      interval: 10s
      timeout: 5s
      retries: 10

  kidctl:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ${KIDCTL_NAME:-kidctl}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://kidctl:${POSTGRES_PASSWORD}@${KIDCTL_NAME:-kidctl}-db:5432/kidctl
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
    networks:
      - traefik
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.${KIDCTL_NAME:-kidctl}.rule=Host(`${KIDCTL_HOST:-app.kidctl.de}`)
      - traefik.http.routers.${KIDCTL_NAME:-kidctl}.entrypoints=websecure
      - traefik.http.routers.${KIDCTL_NAME:-kidctl}.tls=true
      - traefik.http.routers.${KIDCTL_NAME:-kidctl}.tls.certresolver=letsencrypt
      - traefik.http.routers.${KIDCTL_NAME:-kidctl}.middlewares=secHeaders@file
      - traefik.http.services.${KIDCTL_NAME:-kidctl}.loadbalancer.server.port=8000
      # http:// dauerhaft auf https:// umleiten (Entrypoint-Name „web“ ggf. an die Traefik-Konfiguration anpassen)
      - traefik.http.routers.${KIDCTL_NAME:-kidctl}-http.rule=Host(`${KIDCTL_HOST:-app.kidctl.de}`)
      - traefik.http.routers.${KIDCTL_NAME:-kidctl}-http.entrypoints=web
      - traefik.http.routers.${KIDCTL_NAME:-kidctl}-http.middlewares=${KIDCTL_NAME:-kidctl}-https
      - traefik.http.routers.${KIDCTL_NAME:-kidctl}-http.service=${KIDCTL_NAME:-kidctl}
      - traefik.http.middlewares.${KIDCTL_NAME:-kidctl}-https.redirectscheme.scheme=https
      - traefik.http.middlewares.${KIDCTL_NAME:-kidctl}-https.redirectscheme.permanent=true

networks:
  traefik:
    # An den tatsächlichen Namen des Traefik-Netzwerks anpassen (docker network ls)
    name: traefik
    external: true
  internal:
    # nur Server <-> Datenbank, ohne Zugang von außen
    internal: true
